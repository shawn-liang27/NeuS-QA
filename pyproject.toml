[project]
name = "neus-qa"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "cmake==3.29.6",
    "decord>=0.6.0",
    "einops>=0.8.1",
    "gradio>=5.44.1",
    "ninja>=1.13.0",
    "numpy>=2",
    "openai>=1.106.1",
    "opencv-python>=4.12",
    "safetensors>=0.6.2",
    "sentencepiece>=0.2.1",
    "stormpy>=1.10.1",
    "timm>=1.0.19",
    "tqdm>=4.67.1",
    "transformers>=4.41",
    "ultralytics>=8.3.201",
    "vllm==0.11.2",
]

[tool.setuptools.packages.find]
include = ["nsvqa*"]
namespaces = false